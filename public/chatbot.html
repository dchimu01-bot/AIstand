<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>チャットボット体験 — YOROZU</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236d7cff'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        --blue: #2563eb;
        --gray-900: #111827;
        --gray-500: #6b7280;
        --gray-50: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--gray-50);
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP',
          'Yu Gothic UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .section {
        padding: 96px 24px;
      }

      .container {
        max-width: 1152px;
        margin: 0 auto;
      }

      .head {
        text-align: center;
        margin-bottom: 48px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--blue);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h2 {
        margin: 0 0 16px;
        color: var(--gray-900);
        font-size: 36px;
        font-weight: 700;
        line-height: 1.4;
      }

      .lead {
        max-width: 36rem;
        margin: 0 auto;
        color: var(--gray-500);
        font-size: 16px;
        line-height: 1.8;
      }

      .card {
        max-width: 960px;
        margin: 0 auto;
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        background: white;
      }

      .card iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      @media (max-width: 640px) {
        .section {
          padding: 64px 16px;
        }
        h2 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <section class="section">
      <div class="container">
        <div class="head">
          <p class="eyebrow">AI Assistant</p>
          <h2>チャットボット体験</h2>
          <p class="lead">
            YOROZU のAIアシスタントと会話してみてください。
            サービスへのご質問もお気軽にどうぞ。
          </p>
        </div>

        <div class="card">
          <iframe
            src="https://yorozu-ai.vercel.app/yorozu-demo"
            title="YOROZU AI Assistant デモ"
            allow="microphone"
          ></iframe>
        </div>
      </div>
    </section>
  </body>
</html>
