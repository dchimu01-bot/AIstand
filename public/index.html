<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VTuber Studio — デモ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236d7cff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark"></span>
          <span class="brand-name">VTuber Studio</span>
        </div>
        <div class="project" id="project-title">生成AIを業務で安全に使う3つのルール</div>
        <div class="topbar-right">
          <span class="badge" id="status-badge">準備中</span>
          <button class="btn btn-ghost" id="btn-cinema" title="UIを隠してステージだけ表示 (F)">
            シネマ表示
          </button>
        </div>
      </header>

      <main class="body">
        <!-- 左: 入力 -->
        <section class="panel panel-input">
          <h2 class="panel-title">入力</h2>

          <label class="field">
            <span class="field-label">動画の概要</span>
            <textarea id="in-outline" rows="5" spellcheck="false"></textarea>
          </label>

          <label class="field field-grow">
            <span class="field-label">資料</span>
            <textarea id="in-material" spellcheck="false"></textarea>
          </label>

          <label class="field">
            <span class="field-label">形式</span>
            <input id="in-format" type="text" spellcheck="false" />
          </label>

          <label class="field">
            <span class="field-label">声（Google Cloud TTS）</span>
            <select id="in-voice"></select>
          </label>

          <button class="btn btn-primary btn-generate" id="btn-generate">
            <span class="btn-generate-label">AIで生成</span>
          </button>

          <ul class="genlog" id="genlog"></ul>
        </section>

        <!-- 中央: ステージ -->
        <section class="panel panel-stage">
          <div class="stage-wrap">
            <div class="stage" id="stage">
              <div class="slide-layer" id="slide-layer">
                <div class="slide" id="slide">
                  <h3 class="slide-title" id="slide-title"></h3>
                  <ul class="slide-bullets" id="slide-bullets"></ul>
                </div>
              </div>
              <canvas id="canvas"></canvas>
              <div class="subtitle" id="subtitle"></div>
              <div class="stage-loading" id="stage-loading">
                <div class="spinner"></div>
                <div class="stage-loading-text" id="stage-loading-text">VRMモデルを読み込み中</div>
              </div>
              <div class="stage-empty" id="stage-empty">
                <p>左の入力から <strong>AIで生成</strong> を押してください</p>
              </div>
            </div>
          </div>

          <div class="transport">
            <button class="btn btn-play" id="btn-play" aria-label="再生">
              <svg viewBox="0 0 24 24" class="icon-play"><path d="M8 5v14l11-7z" /></svg>
              <svg viewBox="0 0 24 24" class="icon-pause"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
            </button>
            <span class="time" id="time">0:00 / 0:00</span>
            <div class="track" id="track">
              <div class="track-cuts" id="track-cuts"></div>
              <div class="track-progress" id="track-progress"></div>
              <div class="track-head" id="track-head"></div>
            </div>
            <label class="toggle">
              <input type="checkbox" id="toggle-voice" checked />
              <span>音声</span>
            </label>
            <button class="btn btn-ghost" id="btn-export">書き出し</button>
          </div>

          <div class="saved" id="saved" hidden>
            <span class="saved-icon"></span>
            <code class="saved-path" id="saved-path"></code>
            <span class="saved-size" id="saved-size"></span>
            <a class="btn btn-small" id="saved-open" href="#">開く</a>
          </div>
        </section>

        <!-- 右: シーングラフ -->
        <section class="panel panel-graph">
          <h2 class="panel-title">
            シーングラフ
            <span class="panel-hint">AIの出力を直接編集できます</span>
          </h2>
          <ol class="cutlist" id="cutlist"></ol>

          <div class="inspector" id="inspector" hidden>
            <div class="inspector-head">
              <span class="inspector-title" id="inspector-title">カット</span>
              <span class="inspector-dur" id="inspector-dur"></span>
            </div>

            <label class="field">
              <span class="field-label">台詞</span>
              <textarea id="ed-say" rows="3" spellcheck="false"></textarea>
            </label>
            <label class="field">
              <span class="field-label">読み（TTS・口パク用）</span>
              <textarea id="ed-kana" rows="2" spellcheck="false"></textarea>
            </label>

            <div class="field-row">
              <label class="field">
                <span class="field-label">カメラ</span>
                <select id="ed-camera">
                  <option value="wide">ワイド</option>
                  <option value="medium">ミディアム</option>
                  <option value="closeup">クローズアップ</option>
                  <option value="slideFocus">スライド寄り</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">スライド</span>
                <select id="ed-slide"></select>
              </label>
            </div>

            <div class="field-row">
              <label class="field">
                <span class="field-label">表情</span>
                <select id="ed-emotion">
                  <option value="neutral">ふつう</option>
                  <option value="happy">笑顔</option>
                  <option value="relaxed">おだやか</option>
                  <option value="surprised">おどろき</option>
                  <option value="sad">困り顔</option>
                </select>
              </label>
              <label class="field">
                <span class="field-label">モーション</span>
                <select id="ed-gesture">
                  <option value="idle">待機</option>
                  <option value="present">指し示す</option>
                  <option value="nod">うなずく</option>
                  <option value="think">考える</option>
                  <option value="emphasize">強調する</option>
                </select>
              </label>
            </div>

            <div class="nudge">
              <span class="nudge-label">AIに直してもらう</span>
              <div class="nudge-row">
                <input
                  id="ed-nudge"
                  type="text"
                  placeholder="例: もっとカジュアルに、5秒短く"
                  spellcheck="false"
                />
                <button class="btn btn-small" id="btn-nudge">送信</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="./app.js"></script>
  </body>
</html>
