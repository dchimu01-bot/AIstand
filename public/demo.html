<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>実際に体験してみる — AI VTuber スタジオ</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236d7cff'/%3E%3C/svg%3E"
    />
    <style>
      /*
       * YOROZU の LP の #demo セクションと同じ構え（LIVE DEMO の見出し +
       * 丸角カード + iframe）。Tailwind を使わずに同じ見た目を出してある。
       * Next.js に持っていくときの TSX 版は README を参照。
       */
      :root {
        --blue: #2563eb;
        --gray-900: #111827;
        --gray-500: #6b7280;
        --gray-50: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--gray-50);
        font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Noto Sans JP',
          'Yu Gothic UI', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      .section {
        padding: 96px 24px;
      }

      .container {
        max-width: 1152px;
        margin: 0 auto;
      }

      .head {
        text-align: center;
        margin-bottom: 48px;
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--blue);
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      h2 {
        margin: 0 0 16px;
        color: var(--gray-900);
        font-size: 36px;
        font-weight: 700;
        line-height: 1.4;
      }

      .lead {
        max-width: 36rem;
        margin: 0 auto;
        color: var(--gray-500);
        font-size: 16px;
        line-height: 1.8;
      }

      /* デモ本体。16:9 なので YOROZU の縦長カードより横に広い */
      .card {
        max-width: 960px;
        margin: 0 auto;
        aspect-ratio: 16 / 9;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        background: #0b0e17;
      }

      .card iframe {
        width: 100%;
        height: 100%;
        border: 0;
        display: block;
      }

      @media (max-width: 640px) {
        .section {
          padding: 64px 16px;
        }
        h2 {
          font-size: 28px;
        }
      }
    </style>
  </head>
  <body>
    <section id="demo" class="section">
      <div class="container">
        <div class="head">
          <p class="eyebrow">Live Demo</p>
          <h2>実際に体験してみる</h2>
          <p class="lead">
            お題を選ぶだけで、AI VTuber が台本・スライド・カメラワークまで組み立てて
            動画を作ります。そのまま再生してご覧ください。
          </p>
        </div>

        <div class="card">
          <iframe src="./embed" title="AI VTuber デモ体験" allow="autoplay"></iframe>
        </div>
      </div>
    </section>
  </body>
</html>
